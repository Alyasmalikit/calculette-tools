<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us | Calculette-tools</title>
  <style>
    body { font-family: Arial, sans-serif; line-height: 1.6; max-width: 820px; margin: 40px auto; padding: 0 20px; color: #222; }
    h1 { color: #111; }
    form { display: flex; flex-direction: column; gap: 14px; margin-top: 20px; }
    label { font-weight: bold; }
    input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; box-sizing: border-box; }
    button { width: fit-content; padding: 10px 20px; background: #2563eb; color: #fff; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .direct { margin-top: 24px; padding-top: 16px; border-top: 1px solid #e5e7eb; }
    .nav { margin-top: 24px; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Contact Us</h1>
  <p>Have a question, found a bug in a calculator, or want to request a new tool? Send us a message below.</p>

  <form id="contactForm" onsubmit="sendMail(event)">
    <div>
      <label for="name">Your Name</label>
      <input id="name" name="name" type="text" required />
    </div>

    <div>
      <label for="email">Your Email</label>
      <input id="email" name="email" type="email" required />
    </div>

    <div>
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required></textarea>
    </div>

    <button type="submit">Send Message</button>
  </form>

  <div class="direct">
    <p>Prefer email directly? Write to us at <a href="mailto:aliasmalik@gmail.com">aliasmalik@gmail.com</a>.</p>
  </div>

  <div class="nav">
    <a href="index.html">Home</a> |
    <a href="about.html">About Us</a> |
    <a href="privacy.html">Privacy Policy</a> |
    <a href="terms.html">Terms &amp; Disclaimer</a>
  </div>

  <script>
    function sendMail(event) {
      event.preventDefault();
      const name = encodeURIComponent(document.getElementById("name").value);
      const email = encodeURIComponent(document.getElementById("email").value);
      const message = encodeURIComponent(document.getElementById("message").value);
      const subject = encodeURIComponent("Message from Calculette-tools");
      const body = `Name: ${name}%0D%0AEmail: ${email}%0D%0A%0D%0AMessage:%0D%0A${message}`;
      window.location.href = `mailto:aliasmalik@gmail.com?subject=${subject}&body=${body}`;
    }
  </script>
</body>
</html>
