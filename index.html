<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculette-tools</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f1f5f9;
    color: #0f172a;
  }
  .header {
    background: #ffffff;
    border-bottom: 1px solid #cbd5e1;
    padding: 14px 18px;
  }
  .header-box {
    max-width: 1100px;
    margin: 0 auto;
  }
  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 10px;
  }
  .brand {
    font-size: 22px;
    font-weight: bold;
    color: #0f172a;
    text-decoration: none;
  }
  .brand span { color: #2563eb; }
  .lang-box button {
    padding: 6px 12px;
    border: 1px solid #94a3b8;
    background: #f8fafc;
    color: #0f172a;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
  }
  .lang-box button.active {
    background: #2563eb;
    color: #ffffff;
    border-color: #1d4ed8;
  }
  .nav-links {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-start;
    gap: 8px;
  }
  .nav-links a {
    text-decoration: none;
    color: #0f172a;
    background: #e2e8f0;
    border: 1px solid #94a3b8;
    padding: 7px 12px;
    border-radius: 7px;
    font-size: 14px;
    font-weight: bold;
  }
  .nav-links a:hover { background: #cbd5e1; }
  .nav-links a.active {
    background: #2563eb;
    color: #ffffff;
    border-color: #1d4ed8;
  }
  .main {
    max-width: 1100px;
    margin: 22px auto;
    padding: 0 18px 40px;
  }
  .hero {
    background: #1e3a8a;
    color: #ffffff;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 18px;
  }
  .hero h1 { margin: 0 0 6px; font-size: 24px; }
  .hero p { margin: 0; color: #dbeafe; }
  .card {
    background: #ffffff;
    border: 1px solid #cbd5e1;
    border-radius: 12px;
    padding: 20px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 6px;
    color: #334155;
  }
  input {
    width: 100%;
    padding: 10px;
    border: 1px solid #94a3b8;
    border-radius: 8px;
    font-size: 15px;
  }
  .actions {
    margin-top: 16px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .btn-main {
    background: #2563eb;
    color: #ffffff;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
  }
  .btn-reset {
    background: #e2e8f0;
    color: #0f172a;
    border: 1px solid #94a3b8;
    padding: 10px 16px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
  }
  .output {
    margin-top: 16px;
    padding: 14px;
    background: #eff6ff;
    border: 1px solid #93c5fd;
    color: #1e3a8a;
    font-weight: bold;
    font-size: 17px;
    border-radius: 8px;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-box">
    <div class="top-row">
      <a href="index.html" class="brand">Calculette<span>-tools</span></a>
      <div class="lang-box">
        <button type="button" id="bFr" class="active" onclick="switchLang('fr')">FR</button>
        <button type="button" id="bEn" onclick="switchLang('en')">EN</button>
      </div>
    </div>
    <div class="nav-links">
      <a href="index.html" class="active">Home</a>
      <a href="working-time-calculator.html">Working Time</a>
      <a href="working-hour-calculator.html">Working Hours</a>
      <a href="time-calculator.html">Time Calculator</a>
      <a href="feuille-hebdo.html">Weekly Timesheet</a>
      <a href="convertisseur.html">Decimal Converter</a>
      <a href="toiture-croupe.html">Hip Roof</a>
    </div>
  </div>
</div>

<div class="main">
  <div class="hero">
    <h1 id="tHero">Calculateur de Temps de Travail</h1>
    <p id="tSub">Calculez vos heures nettes et la conversion en centièmes (1/100e).</p>
  </div>

  <div class="card">
    <div class="grid">
      <div>
        <label id="lStart" for="tStart">Heure de début</label>
        <input type="time" id="tStart" value="09:00" oninput="runCalc()">
      </div>
      <div>
        <label id="lEnd" for="tEnd">Heure de fin</label>
        <input type="time" id="tEnd" value="17:30" oninput="runCalc()">
      </div>
      <div>
        <label id="lBreak" for="tBreak">Pause (minutes)</label>
        <input type="number" id="tBreak" value="30" min="0" oninput="runCalc()">
      </div>
    </div>

    <div class="output" id="outBox">Temps net : 08h 00min (8.00 h)</div>

    <div class="actions">
      <button type="button" class="btn-main" id="btnRun" onclick="runCalc()">Calculer</button>
      <button type="button" class="btn-reset" id="btnClr" onclick="clrCalc()">Réinitialiser</button>
    </div>
  </div>
</div>

<script>
  var langNow = "fr";
  var txt = {
    fr: {
      hero: "Calculateur de Temps de Travail",
      sub: "Calculez vos heures nettes et la conversion en centièmes (1/100e).",
      start: "Heure de début",
      end: "Heure de fin",
      brk: "Pause (minutes)",
      run: "Calculer",
      clr: "Réinitialiser",
      res: "Temps net"
    },
    en: {
      hero: "Working Time Calculator",
      sub: "Calculate net working hours and decimal hundredths (1/100th).",
      start: "Start time",
      end: "End time",
      brk: "Break (minutes)",
      run: "Calculate",
      clr: "Reset",
      res: "Net time"
    }
  };

  function switchLang(l) {
    langNow = l;
    document.getElementById("bFr").className = l === "fr" ? "active" : "";
    document.getElementById("bEn").className = l === "en" ? "active" : "";
    document.getElementById("tHero").textContent = txt[l].hero;
    document.getElementById("tSub").textContent = txt[l].sub;
    document.getElementById("lStart").textContent = txt[l].start;
    document.getElementById("lEnd").textContent = txt[l].end;
    document.getElementById("lBreak").textContent = txt[l].brk;
    document.getElementById("btnRun").textContent = txt[l].run;
    document.getElementById("btnClr").textContent = txt[l].clr;
    runCalc();
  }

  function minsOf(val) {
    if (!val || val.indexOf(":") === -1) return null;
    var parts = val.split(":");
    var h = parseInt(parts[0], 10);
    var m = parseInt(parts[1], 10);
    if (isNaN(h) || isNaN(m)) return null;
    return h * 60 + m;
  }

  function runCalc() {
    var s = minsOf(document.getElementById("tStart").value);
    var e = minsOf(document.getElementById("tEnd").value);
    var b = parseInt(document.getElementById("tBreak").value, 10);
    if (isNaN(b) || b < 0) b = 0;
    if (s === null || e === null) return;
    var diff = e - s;
    if (diff < 0) diff += 1440;
    var net = diff - b;
    if (net < 0) net = 0;
    var hh = Math.floor(net / 60);
    var mm = net % 60;
    var hStr = (hh < 10 ? "0" : "") + hh;
    var mStr = (mm < 10 ? "0" : "") + mm;
    var dec = (net / 60).toFixed(2);
    document.getElementById("outBox").textContent = txt[langNow].res + " : " + hStr + "h " + mStr + "min (" + dec + " h)";
  }

  function clrCalc() {
    document.getElementById("tStart").value = "09:00";
    document.getElementById("tEnd").value = "17:30";
    document.getElementById("tBreak").value = "30";
    runCalc();
  }

  runCalc();
</script>

</body>
</html>
