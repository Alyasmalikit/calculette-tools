<!-- Simple Hip Roof Diagram -->
  <div class="diagram-card">
    <svg viewBox="0 0 600 185" role="img" aria-label="Schéma géométrique d'une toiture en croupe">
      <rect x="0" y="0" width="600" height="185" rx="10" fill="#f8fafc"/>
      <!-- Base footprint (Égout) -->
      <polygon points="80,145 520,145 475,115 125,115" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
      <!-- Back slope -->
      <polygon points="125,115 475,115 405,45 195,45" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <!-- Left Hip (Croupe) -->
      <polygon points="80,145 125,115 195,45" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
      <!-- Right Hip (Croupe) -->
      <polygon points="520,145 475,115 405,45" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
      <!-- Front main slope (Long pan) -->
      <polygon points="80,145 520,145 405,45 195,45" fill="#eff6ff" fill-opacity="0.88" stroke="#1d4ed8" stroke-width="2.2"/>
      <!-- Ridge (Faîtage) -->
      <line x1="195" y1="45" x2="405" y2="45" stroke="#dc2626" stroke-width="3"/>
      <!-- Crown height dashed line -->
      <line x1="300" y1="45" x2="300" y2="130" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,4"/>
      <circle cx="300" cy="45" r="3.5" fill="#16a34a"/>
      <circle cx="300" cy="130" r="3.5" fill="#16a34a"/>
      <!-- Labels -->
      <text x="300" y="34" fill="#dc2626" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Faîtage</text>
      <text x="310" y="92" fill="#16a34a" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Hauteur (H)</text>
      <text x="128" y="88" fill="#1e40af" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="end">Arêtier</text>
      <text x="472" y="88" fill="#1e40af" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="start">Croupe</text>
      <text x="300" y="164" fill="#334155" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Ligne d'égout (Long pan)</text>
    </svg>
    <div class="diagram-caption" data-t="diagCap">Vue schématique : ligne d'égout, hauteur de couronnement, chevrons d'emprunt et arêtiers.</div>
  </div>
