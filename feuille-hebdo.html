<!DOCTYPE html>
<html lang="fr">
<head>

<title>Feuille d'Heures Hebdomadaire (35h / 39h) | Calculette-tools</title>

<style>
  :root {
    --bg: #f4f7fb;
    --surface: #ffffff;
    --ink: #0f172a;
    --muted: #475569;
    --border: #e2e8f0;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --soft: #eff6ff;
    --radius: 14px;
    --shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    max-width: 100%;
    overflow-x: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.55;
  }
  .container {
    width: 100%;
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 16px;
  }

  /* Header */
  .site-header {
    width: 100%;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .nav-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    padding: 12px 0;
  }
  .brand {
    font-weight: 800;
    font-size: 1.15rem;
    color: var(--ink);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .brand-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--primary);
    display: inline-block;
  }
  .nav-right {
    display: flex;
    align-items: center;
    flex-wrap: wrap;

    min-width: 0;

  .nav-menu {

    flex-wrap: wrap;
    gap: 4px;

  }
  .nav-menu a {
    color: var(--muted);

    font-size: 0.85rem;
    font-weight: 600;
    padding: 6px 9px;
    border-radius: 8px;
    white-space: nowrap;
  }
  .nav-menu a:hover, .nav-menu a.active {
    color: var(--primary);
    background: var(--soft);
  }
  .lang-btn {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 6px 12px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 0.82rem;
    cursor: pointer;
    flex-shrink: 0;
  }
  .lang-btn:hover { background: var(--primary-hover); }

  /* Page Head */
  .page-head { padding: 24px 0 12px; }

    margin: 0 0 6px;

  .page-head p { margin: 0; color: var(--muted); font-size: 0.94rem; }

  /* Diagram Card */
  .diagram-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    box-shadow: var(--shadow);
    margin-bottom: 18px;
    text-align: center;
  }
  .diagram-card svg {
    width: 100%;
    max-width: 620px;
    height: auto;
    display: block;
    margin: 0 auto;
  }
  .diagram-caption {
    margin-top: 6px;
    font-size: 0.8rem;
    color: var(--muted);
    font-weight: 600;

  .card {
    background: var(--surface);

    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
    min-width: 0;

  .top-bar {

    flex-wrap: wrap;
    align-items: center;

  }

    gap: 8px;

    padding: 7px 8px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 0.88rem;
    background: #fff;
    color: var(--ink);
    min-width: 0;
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
  }
  .btn-group {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .btn {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.86rem;
    cursor: pointer;
  }
  .btn:hover { background: var(--primary-hover); }
  .btn-sec {
    background: #f1f5f9;
    color: var(--ink);
    border: 1px solid #cbd5e1;
    padding: 8px 14px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.86rem;
    cursor: pointer;
  }
  .btn-sec:hover { background: #e2e8f0; }

  /* Timesheet Table */
  .table-wrap {
    width: 100%;
    overflow-x: auto;
  }
  table.ts-table {
    width: 100%;
    border-collapse: collapse;
    min-width: 640px;
    font-size: 0.88rem;
  }
  .ts-table th, .ts-table td {
    padding: 9px 8px;
    border-bottom: 1px solid var(--border);
    text-align: left;
  }
  .ts-table th {
    font-size: 0.76rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--muted);
    background: #f8fafc;
  }
  .day-name { font-weight: 700; color: var(--ink); }
  .net-cell { font-weight: 700; color: var(--primary); white-space: nowrap; }

  /* Summary Grid */
  .sum-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr));
    gap: 12px;
    margin-top: 18px;
  }
  .sum-box {
    background: var(--soft);
    border: 1px solid #bfdbfe;
    border-radius: 10px;
    padding: 12px;
  }
  .sum-lbl {
    display: block;
    font-size: 0.76rem;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 3px;
  }
  .sum-val {
    font-size: 1.05rem;
    font-weight: 800;
    color: var(--ink);
  }

  /* Footer */
  .site-footer {
    width: 100%;
    border-top: 1px solid var(--border);
    background: var(--surface);
    padding: 22px 0 32px;
    text-align: center;
    font-size: 0.86rem;
    color: var(--muted);
    margin-top: 24px;
  }
  .footer-links {
    margin-top: 10px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
  }
  .footer-links a {
    color: var(--muted);
    text-decoration: none;
    font-weight: 500;
  }
  .footer-links a:hover { color: var(--primary); }

  @media print {
    .site-header, .btn-group, .diagram-card, .site-footer { display: none !important; }
    body { background: #fff; }
    .card { box-shadow: none; border: 1px solid #cbd5e1; }
  }
